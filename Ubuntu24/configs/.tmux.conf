# Mouse support
set -g mouse on

# Better splits. -c: the new pane starts in the folder of the pane you split
# from (tmux's default is the folder the session was started in).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Pane navigation with Alt+arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Allow Alt-arrow word jumps in shell
set -g xterm-keys on
#bind -n M-Left send-keys M-Left
#bind -n M-Right send-keys M-Right

# Large scrollback
set -g history-limit 50000

# ---------------------------------------------------------------------------
# Copying to the system clipboard
# ---------------------------------------------------------------------------
# Out of the box tmux hands a copy to the terminal as an OSC 52 escape sequence
# (`set-clipboard external`). Alacritty accepts it only sometimes, which is why
# mouse copies reached the clipboard unpredictably. Pipe through xclip instead:
# deterministic, and independent of which terminal tmux happens to run in.
#
# Every binding is duplicated into copy-mode and copy-mode-vi because tmux only
# uses the -vi table when mode-keys is vi; ours is emacs (the default).
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode    Enter             send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'

# Double-click copies the word, triple-click the line. These are tmux's own
# bindings with the xclip pipe bolted on -- without them those two still go out
# through the flaky OSC 52 path.
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel 'xclip -selection clipboard -in' }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel 'xclip -selection clipboard -in' }

# ---------------------------------------------------------------------------
# Scrolling the history
# ---------------------------------------------------------------------------
# While tmux runs, the terminal's own scrollback is empty -- the history lives
# in tmux -- so anything that scrolls has to go through copy-mode. The wheel
# already does (mouse on); this adds the keyboard. `q` or `Esc` leaves again.
bind -n S-PageUp  copy-mode -u
bind -T copy-mode    S-PageUp   send -X page-up
bind -T copy-mode    S-PageDown send -X page-down
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

# tmux waits 500ms after an Esc to see whether it starts an escape sequence,
# which makes ble.sh's Esc bindings feel broken inside tmux. 10ms is plenty.
set -s escape-time 10

# Truecolor support. The Tc override only matches TERM=xterm-256color, which
# is what Alacritty sets while its own terminfo is missing. Once `alacritty`
# terminfo is installed it sets TERM=alacritty and Tc would no longer apply,
# so declare RGB for both names via terminal-features (tmux >= 3.2) too.
set -ga terminal-overrides ',xterm-256color:Tc'
set -as terminal-features ',xterm-256color:RGB,alacritty:RGB'

# ---------------------------------------------------------------------------
# Tabs  --  tmux windows, shown like browser tabs in a bar at the TOP
# ---------------------------------------------------------------------------
# Every window (Ctrl+B c, Alt+T) is a tab with its own set of panes. The bar
# has two lines: the tabs, and under them a reminder of the tab keys. tmux
# puts all status lines on the same side, so both sit on top.
#
#   Alt+1 .. Alt+9   go to tab N            Alt+T   new tab (in this folder)
#   click a tab      go to it               Alt+N   rename the tab ("name")
#   Ctrl+B w         all tabs with previews Alt+K   close the tab ("kill")
#
# All of these work without Ctrl+B. Alt+1..9 and Alt+T are taken from the
# shell while inside tmux (readline's digit-argument / transpose-words, which
# nobody misses); Alt+N and Alt+K were unbound in ble.sh. Not Ctrl+K: that is
# the shell's delete-to-end-of-line.
# Colours are the Tokyo Night values from shared/alacritty.toml.
set -g base-index 1                  # tabs numbered 1..9, like Alt+1..9
setw -g pane-base-index 1
set -g renumber-windows on           # close tab 2 of 3 -> the third becomes 2

set -g status-position top
set -g status 2
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#a9b1d6"

# Line 1: tabs on the left; on the right a badge for the current state, then
# user@host · session · date + time.
#   Ctrl+B …   (yellow)  the prefix was pressed, tmux waits for the next key
#   COPY       (magenta) copy / scroll mode
set -g status-left " "
set -g status-left-length 2
set -g window-status-separator ""
set -g window-status-format         " #I #W#{?window_zoomed_flag, [z],} "
set -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26] #I #W#{?window_zoomed_flag, [z],} #[default]"
set -g status-right-length 80
# The tabs need the room more than the clock does: below 110 columns only
# "session · time" is shown, so four tabs still fit in an 80-column window.
set -g @right-full  "#[fg=#a9b1d6]#{client_user}@#{=/16/…:host_short} #[fg=#565f89]· #[fg=#7aa2f7]#S #[fg=#565f89]· %a %d.%m %H:%M "
set -g @right-short "#[fg=#7aa2f7]#S #[fg=#565f89]· %H:%M "
set -g status-right "#{?client_prefix,#[fg=#1a1b26 bg=#e0af68 bold] Ctrl+B … #[default] ,}#{?#{==:#{pane_mode},copy-mode},#[fg=#1a1b26 bg=#bb9af7 bold] COPY #[default] ,}#{?#{e|<:#{client_width},110},#{E:@right-short},#{E:@right-full}}"

# Line 2: hints for whatever you are doing right now -- the tab keys
# normally, the keys that may follow the prefix right after Ctrl+B, and the
# keys of copy mode / the Ctrl+B w tab list while those are open. Each text
# lives in its own @option (keep them <= 79 columns; tmux cuts the rest) and
# is pulled in with #{@name}, so commas in the text cannot break the #{?...}
# conditions around it. (Index 0 is tmux's default tabs line, kept as is.)
set -g @hint-tabs   " Alt+1…9 tab · Alt+T new tab · Alt+N rename · Alt+K close tab · Ctrl+B w all"
set -g @hint-prefix " then: z zoom · Ctrl+← ↑ → ↓ resize · d detach · ? all commands list"
set -g @hint-copy   " Ctrl+Space select · Enter copy · Ctrl+S / Ctrl+R search · n next · q exit"
set -g @hint-tree   " ↑ ↓ choose · → expand · Enter go there · x close · q back"
# Messages and prompts (rename, "close tab?", "Config reloaded", Ctrl+B :)
# go on this hint line too. By default tmux draws them on line 0, right over
# the tabs and the clock.
set -g message-line 1
set -g status-format[1] "#{?client_prefix,#[fg=#e0af68]#{@hint-prefix},#{?#{==:#{pane_mode},copy-mode},#[fg=#bb9af7]#{@hint-copy},#{?#{==:#{pane_mode},tree-mode},#[fg=#7dcfff]#{@hint-tree},#[fg=#565f89]#{@hint-tabs}}}}"

# Tab names: the folder you are in while the shell is idle, the running
# program otherwise (vim, btop, ssh ...). Rename one by hand with Ctrl+B , --
# that switches automatic renaming off for that tab.
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m/r:^(bash|zsh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"

# New tab in the current folder; Alt+T and Alt+1..9 work without the prefix.
bind c new-window -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Rename / close the current tab. Closing kills every pane and program in it,
# so it asks first; -y makes a plain Enter mean "yes", which also works when
# the Ukrainian layout turns the "y" key into "н".
bind -n M-n command-prompt -I "#W" -p "tab name:" { rename-window "%%" }
bind -n M-k confirm-before -y -p "close tab #I (#W)? (y/n, Enter = yes)" kill-window


# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded" 

# ---------------------------------------------------------------------------
# The same keys on the Ukrainian layout
# ---------------------------------------------------------------------------
# With the Ukrainian layout on, the key pressed after the prefix arrives as a
# Cyrillic letter (Ctrl+B then d is "в"), and tmux has no binding for it. So
# every prefix key in use is bound a second time under the Ukrainian letter on
# the same key cap (xkb "ua"). The prefix itself already works: Alacritty
# turns Ctrl+И into Ctrl+B (shared/alacritty.toml).
# Deliberately NOT mirrored: x / & (kill pane / window) -- their confirm
# prompt accepts only a Latin "y" -- and $ (rename session), whose key gives
# ";" on this layout, which is already last-pane.
bind ґ split-window -h -c "#{pane_current_path}"   # |  (| needs AltGr here)
bind Ґ split-window -h -c "#{pane_current_path}"
bind Є split-window -v -c "#{pane_current_path}"   # "  (Shift+2 types " too)
bind в detach-client         # d
bind с new-window -c "#{pane_current_path}"         # c
bind т next-window           # n
bind з previous-window       # p
bind д last-window           # l
bind ц choose-tree -Zw       # w
bind і choose-tree -Zs       # s
bind щ select-pane -t :.+    # o
bind ж last-pane             # ;
bind й display-panes         # q
bind я resize-pane -Z        # z
bind е clock-mode            # t
bind х copy-mode             # [
bind ї paste-buffer -p       # ]
bind Х swap-pane -U          # {
bind Ї swap-pane -D          # }
bind б command-prompt -I "#W" { rename-window "%%" }            # ,
bind к source-file ~/.tmux.conf \; display "Config reloaded"     # r
bind -T copy-mode    й send -X cancel                            # q
bind -T copy-mode-vi й send -X cancel                            # q
bind -T copy-mode-vi н send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'      # y
