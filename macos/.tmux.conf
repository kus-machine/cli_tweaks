# Mouse support
set -g mouse on

# Better splits
bind | split-window -h
bind - split-window -v

# Pane navigation with Alt+arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Allow Alt-arrow word jumps in shell
set -g xterm-keys on
# commented because of conflict with upper Alt+arr to navigate windows. Use Ctrl+arr to navigate words
#bind -n M-Left send-keys M-Left
#bind -n M-Right send-keys M-Right

# Large scrollback
set -g history-limit 50000

# ---------------------------------------------------------------------------
# Copying to the system clipboard   [DRAFT - not yet tested on a Mac]
# ---------------------------------------------------------------------------
# Mirrors Ubuntu24/configs/.tmux.conf with pbcopy in place of xclip. See the
# comments there for why we bypass tmux's OSC 52 (`set-clipboard external`)
# path, and why every binding is duplicated into both copy-mode tables.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode    Enter             send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel 'pbcopy'

bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel 'pbcopy' }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel 'pbcopy' }

# ---------------------------------------------------------------------------
# Scrolling the history
# ---------------------------------------------------------------------------
bind -n S-PageUp  copy-mode -u
bind -T copy-mode    S-PageUp   send -X page-up
bind -T copy-mode    S-PageDown send -X page-down
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

# Don't sit on an Esc for half a second before passing it through.
set -s escape-time 10

# Truecolor support
set -ga terminal-overrides ',xterm-256color:Tc'

# Status bar nice
set -g status-bg black
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 80
set -g status-right "#[fg=green]%Y-%m-%d %H:%M #[fg=cyan]#H"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
